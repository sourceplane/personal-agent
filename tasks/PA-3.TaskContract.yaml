apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: PA-3
  title: "personal-agent becomes an Orun baseline"
spec:
  goal: blueprint.yaml and repo-blueprint.yaml take a new personal AI agent from nothing to live on stage and prod in one landing, held by Baseline CI
  affects:
    - blueprint.yaml
    - repo-blueprint.yaml
    - BOOTSTRAP.md
    - .baseline
    - .github/workflows/baseline.yml
    - .github/workflows/tag.yml
    - ai/context
    - docs/phases
    - hooks
    - testing
    - tooling/rebrand
    - tooling/bootstrap
    - tooling/catalog
    - apps/api/docs
    - tests/api/docs
    - specs/epics/personal-agent
    - README.md
  doneWhen:
    - every Baseline CI tier is green
    - an agent placed from it carries the agent only, branded, with its licence
  gates: []
